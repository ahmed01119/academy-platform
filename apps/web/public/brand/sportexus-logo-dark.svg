<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 180" fill="none">
  <defs>
    <!-- Upper Wing: Blue to Cyan Gradient -->
    <linearGradient id="logoUpperGrad" x1="15%" y1="10%" x2="90%" y2="85%">
      <stop offset="0%" stop-color="#0A3BFF" />
      <stop offset="40%" stop-color="#0077FF" />
      <stop offset="80%" stop-color="#00C4FF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Lower Wing: Emerald to Lime Green Gradient -->
    <linearGradient id="logoLowerGrad" x1="10%" y1="20%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="35%" stop-color="#22C55E" />
      <stop offset="75%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#84F06B" />
    </linearGradient>

    <!-- Wordmark "exus" Gradient -->
    <linearGradient id="wordmarkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D6FF" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>

    <!-- Ball Shading -->
    <radialGradient id="logoBallShade" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </radialGradient>
  </defs>

  <!-- ==================== SPORTEXUS ICON (LEFT) ==================== -->
  <g transform="translate(15, 10) scale(0.68)">
    <!-- Lower Wing (Green) -->
    <path
      d="M 125 108 
         C 155 120, 182 142, 172 170
         C 162 196, 125 208, 92 205
         C 62 202, 38 185, 25 174
         C 48 182, 85 190, 114 184
         C 138 178, 150 162, 142 148
         C 132 132, 102 122, 78 114
         C 52 105, 34 94, 45 78
         C 52 88, 72 98, 96 103
         Z"
      fill="url(#logoLowerGrad)"
    />

    <!-- Upper Wing (Blue/Cyan) -->
    <path
      d="M 30 75
         C 35 52, 65 30, 108 24
         C 152 18, 192 35, 206 68
         C 218 95, 202 124, 172 136
         C 145 147, 115 142, 100 134
         C 122 136, 152 130, 170 114
         C 186 98, 188 74, 172 56
         C 152 36, 118 34, 88 42
         C 60 50, 42 64, 30 75
         Z"
      fill="url(#logoUpperGrad)"
    />

    <!-- Lead Feather -->
    <path
      d="M 28 78
         C 42 66, 68 52, 98 46
         C 70 56, 48 74, 34 96
         C 31 89, 29 83, 28 78
         Z"
      fill="#00D6FF"
      opacity="0.9"
    />

    <!-- Football In Upper Loop -->
    <g transform="translate(142, 82)">
      <circle cx="2" cy="3" r="32" fill="#0F172A" opacity="0.4" />
      <circle cx="0" cy="0" r="32" fill="url(#logoBallShade)" stroke="#CBD5E1" stroke-width="1.2" />
      <polygon points="0,-10 9,-3 6,8 -6,8 -9,-3" fill="#0F172A" />
      <polygon points="0,-10 0,-24 12,-30 16,-20 9,-3" fill="#1E293B" opacity="0.95" />
      <line x1="0" y1="-10" x2="0" y2="-24" stroke="#94A3B8" stroke-width="1.5" />
      <polygon points="-22,-6 -28,-18 -16,-24 0,-24 -9,-3" fill="#0F172A" opacity="0.85" />
      <polygon points="9,-3 23,-3 30,8 22,18 6,8" fill="#1E293B" opacity="0.9" />
      <polygon points="-6,8 -14,20 -26,16 -28,4 -9,-3" fill="#0F172A" opacity="0.9" />
      <polygon points="6,8 4,24 -8,25 -14,20 -6,8" fill="#1E293B" opacity="0.9" />
      <ellipse cx="-10" cy="-12" rx="9" ry="5" fill="#00D6FF" opacity="0.35" transform="rotate(-30, -10, -12)" />
      <circle cx="-12" cy="-14" r="3" fill="#FFFFFF" opacity="0.8" />
    </g>

    <!-- Wing Highlight -->
    <path
      d="M 112 186
         C 134 180, 148 166, 142 152
         C 146 164, 134 176, 112 182
         C 86 188, 54 182, 32 174
         C 52 180, 84 188, 112 186
         Z"
      fill="#84F06B"
      opacity="0.8"
    />
  </g>

  <!-- ==================== WORDMARK (RIGHT) ==================== -->
  <g transform="translate(195, 96)">
    <!-- "Sport" (White, Bold Sans) -->
    <text
      x="0"
      y="0"
      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
      font-size="78"
      font-weight="800"
      letter-spacing="-1.5"
      fill="#FFFFFF"
    >Sport</text>

    <!-- "exus" (Vibrant Cyan-Green Gradient) -->
    <text
      x="200"
      y="0"
      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
      font-size="78"
      font-weight="700"
      letter-spacing="-1"
      fill="url(#wordmarkGrad)"
    >exus</text>

    <!-- TM SuperScript -->
    <text
      x="368"
      y="-42"
      font-family="system-ui, -apple-system, sans-serif"
      font-size="16"
      font-weight="800"
      fill="#00D6FF"
      opacity="0.85"
    >™</text>

    <!-- Subtitle: ACADEMY PLATFORM -->
    <text
      x="6"
      y="42"
      font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
      font-size="18"
      font-weight="700"
      letter-spacing="10"
      fill="#94A3B8"
    >ACADEMY PLATFORM</text>
  </g>
</svg>
