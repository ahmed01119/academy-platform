# Self-hosted production topology. Do not use for local demo (see docker-compose.yml).
# Requires .env.production — never commit real secrets.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-academy}
      POSTGRES_USER: ${POSTGRES_USER:-academy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?set POSTGRES_RUNTIME_PASSWORD}
    volumes:
      - academy_prod_pg:/var/lib/postgresql/data
      - ./infrastructure/postgres/01-runtime-role.sh:/docker-entrypoint-initdb.d/01-runtime-role.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - academy_internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - academy_prod_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - academy_internal

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: on-failure
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_ADMIN_URL:?set DATABASE_ADMIN_URL}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      [
        'pnpm',
        '--filter',
        '@academy/database',
        'exec',
        'prisma',
        'migrate',
        'deploy',
      ]
    networks:
      - academy_internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      API_VERSION: ${API_VERSION:-0.1.0}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_TOKEN_EXPIRES_DAYS: ${REFRESH_TOKEN_EXPIRES_DAYS:-7}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN}
      COOKIE_SECURE: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/v1/health/ready || exit 1']
      interval: 20s
      timeout: 5s
      retries: 8
    networks:
      - academy_internal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?set NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Academy Platform}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    networks:
      - academy_internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '${CADDY_HTTP_PORT:-80}:80'
      - '${CADDY_HTTPS_PORT:-443}:443'
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      API_DOMAIN: ${API_DOMAIN:-api.localhost}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-ops@localhost}
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - academy_caddy_data:/data
      - academy_caddy_config:/config
    depends_on:
      - web
      - api
    networks:
      - academy_internal

networks:
  academy_internal:
    driver: bridge

volumes:
  academy_prod_pg:
  academy_prod_redis:
  academy_caddy_data:
  academy_caddy_config:
