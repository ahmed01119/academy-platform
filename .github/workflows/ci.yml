name: CI

on:
  push:
    branches: [main, master, 'feat/**']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build & docker verification
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: academy
          POSTGRES_PASSWORD: academy
          POSTGRES_DB: academy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U academy -d academy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://academy:academy@localhost:5432/academy?schema=public
      REDIS_URL: redis://localhost:6379
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate version metadata
        run: node scripts/generate-version.js

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Validate Prisma schema
        run: pnpm --filter @academy/database exec prisma validate

      - name: Deploy Prisma migrations
        run: pnpm --filter @academy/database exec prisma migrate deploy

      - name: Verify migration status
        run: pnpm --filter @academy/database exec prisma migrate status

      - name: Validate schema drift
        run: pnpm --filter @academy/database exec prisma migrate diff --from-schema-datamodel prisma/schema.prisma --to-schema-datasource prisma/schema.prisma --exit-code

      - name: Test audit-log append-only protection
        env:
          PGPASSWORD: academy
        run: psql -v ON_ERROR_STOP=1 -h localhost -U academy -d academy -f packages/database/tests/audit-append-only.sql

      - name: Provision restricted CI runtime database role
        env:
          PGPASSWORD: academy
        run: psql -v ON_ERROR_STOP=1 -h localhost -U academy -d academy -f packages/database/tests/runtime-role-setup.sql

      - name: Test runtime database privilege boundaries
        env:
          PGPASSWORD: academy
        run: psql -v ON_ERROR_STOP=1 -h localhost -U academy -d academy -f packages/database/tests/runtime-role-privileges.sql

      - name: Test tenant RLS isolation
        env:
          PGPASSWORD: academy
        run: psql -v ON_ERROR_STOP=1 -h localhost -U academy -d academy -f packages/database/tests/tenant-rls.sql

      - name: Test onboarding and invitation security boundaries
        env:
          PGPASSWORD: academy
        run: psql -v ON_ERROR_STOP=1 -h localhost -U academy -d academy -f packages/database/tests/onboarding-and-invitations.sql

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build applications
        run: pnpm build

      - name: Validate production Compose file
        run: docker compose -f docker-compose.prod.yml config
        env:
          POSTGRES_PASSWORD: ci-placeholder
          POSTGRES_RUNTIME_PASSWORD: ci-placeholder-runtime
          DATABASE_URL: postgresql://academy_runtime:ci@postgres:5432/academy?schema=public
          DATABASE_ADMIN_URL: postgresql://academy:ci@postgres:5432/academy?schema=public
          JWT_SECRET: ci-placeholder-jwt-secret-32chars
          CORS_ORIGIN: https://app.example.test
          NEXT_PUBLIC_API_BASE_URL: https://api.example.test/v1

      - name: Verify Backend Docker Build
        run: docker build -f Dockerfile -t sportexus-api:ci .

      - name: Verify Frontend Docker Build
        run: docker build -f Dockerfile.web -t sportexus-web:ci .
